name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.26", "1.27"]
        module: [".", "brokers", "scenarios", "targets/watermill", "targets/cloudevents"]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: "**/go.sum"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -count=1 ./...
        env:
          ACKHAMMER_REPORT_DIR: ${{ github.workspace }}/reports
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ackhammer-reports-${{ matrix.go }}-${{ strategy.job-index }}
          path: reports/
          if-no-files-found: ignore

  # Single required check for branch protection, whatever the matrix.
  ci:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = success
